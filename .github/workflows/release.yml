name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Compile Inno Setup Script
        shell: pwsh
        run: |
          $iscc = (Get-ChildItem -Path "C:\Program Files*\Inno Setup*", "C:\ProgramData\chocolatey\bin" -Filter "iscc.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName)
          if (-not $iscc) {
            throw "ISCC.exe not found after Chocolatey installation!"
          }
          Write-Host "Using ISCC compiler: $iscc"
          & $iscc installer.iss

      - name: Determine Release Tag
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            NAME="Piper TTS ${{ github.ref_name }}"
          else
            TAG="v1.0.${{ github.run_number }}"
            NAME="Piper TTS v1.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Create Release and Upload Installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/PiperTTS_Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
