name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Номер версии для релиза (например: v1.1.0)'
        required: true
        default: 'v1.1.0'
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Compile Inno Setup Script
        shell: pwsh
        run: |
          $iscc = (Get-ChildItem -Path "C:\Program Files*\Inno Setup*", "C:\ProgramData\chocolatey\bin" -Filter "iscc.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName)
          if (-not $iscc) {
            throw "ISCC.exe not found after Chocolatey installation!"
          }
          Write-Host "Using ISCC compiler: $iscc"
          & $iscc installer.iss

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiperTTS_Setup
          path: dist/PiperTTS_Setup.exe
          if-no-files-found: error

      - name: Determine Release Tag
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.version }}"
            # Автоматически добавляем префикс 'v', если пользователь ввел просто '1.1.0'
            if [[ ! "$TAG" =~ ^v ]]; then
              TAG="v$TAG"
            fi
            NAME="Piper TTS $TAG"
          else
            TAG="${{ github.ref_name }}"
            NAME="Piper TTS ${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Create Release and Upload Installer
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/PiperTTS_Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
